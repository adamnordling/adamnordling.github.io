<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>404 — Page Not Found | Adam Nordling</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg"/>
    <style>
        :root {
            --bg: #131418;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #60a5fa;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 480px;
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            color: var(--accent);
            font-family: ui-monospace, monospace;
            line-height: 1;
        }

        h2 {
            font-size: 1.5rem;
            margin: 16px 0 8px;
        }

        p {
            color: var(--muted);
            margin-bottom: 28px;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            background: var(--text);
            color: var(--bg);
            font-weight: 600;
            text-decoration: none;
            padding: 10px 22px;
            border-radius: 6px;
            transition: opacity 0.2s;
        }

        a:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page or resource you are looking for has moved or does not exist.</p>
    <a href="./">Back to Portfolio</a>
</div>
</body>
</html>
